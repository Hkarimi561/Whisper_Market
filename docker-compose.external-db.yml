# Use this when you already have a PostgreSQL server and only own a full DATABASE_URL
# (no separate user/password). It starts only the app; migrations still run on start.
#
#   DATABASE_URL=postgresql://USER:PASSWORD@HOST:5432/DBNAME  docker compose -f docker-compose.external-db.yml up --build
#
# or put DATABASE_URL=... in a .env file next to this file.
#
# If HOST is a container / alias on an existing Docker network, uncomment the `networks` parts below
# and set EXTERNAL_NETWORK to that network's name so the app can resolve the host name.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL, e.g. postgresql://user:password@host:5432/dbname}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - '${APP_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    # networks: [default, external-db]

# networks:
#   external-db:
#     external: true
#     name: ${EXTERNAL_NETWORK:-whisper-net}
